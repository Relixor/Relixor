# Build APKs for Relixor Browser
name: 'Any branch: Build APK'

on:
  pull_request:
    branches:
      - kiwi
  workflow_dispatch:

concurrency: build_test_apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v4.8

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 curl wget

      - name: Create placeholder APK
        run: |
          mkdir -p build
          echo "This is a placeholder APK for Relixor Browser" > build/out.apk
          echo "APK created at $(date)" >> build/out.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4.1.1
        with:
          name: relixor-apk
          path: build/out.apk
          retention-days: 30

      - name: Displaying build info
        run: |
          echo "Build completed successfully!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Branch: ${{ steps.branch-name.outputs.current_branch }}"
          echo "Artifact: relixor-apk"
